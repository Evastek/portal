<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evastek</title>
<meta name="description" content="Evastek – Elevare Strategic Marketing. Fale com a gente e conheça nosso trabalho.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%230358ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --ink:#fff;
  --muted:#9aa3b2;
  --blue:#0358ff;
  --blue-hi:#3d7bff;
  --line:rgba(255,255,255,.16);
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* Triângulo grande ao fundo: ecoa o triângulo azul do "v" da logo */
.angle{
  position:fixed;right:-18vmin;bottom:-6vmin;
  width:96vmin;height:96vmin;
  background:linear-gradient(200deg,rgba(3,88,255,.55),rgba(3,88,255,0) 70%);
  clip-path:polygon(100% 0,100% 100%,0 100%);
  pointer-events:none;
  opacity:0;transform:translateY(8vmin);
  transition:opacity 1.4s var(--ease),transform 1.4s var(--ease);
}
.ready .angle{opacity:1;transform:none}

.page{
  position:relative;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}

.logo{
  display:block;width:min(78vw,320px);height:auto;
  clip-path:inset(0 100% 0 0);
  animation:reveal 1s var(--ease) .25s forwards;
}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}

/* Bloco que abre depois da intro: a logo sobe sozinha porque o conjunto é centralizado */
.more{
  display:grid;grid-template-rows:0fr;width:100%;
  transition:grid-template-rows 1s var(--ease);
}
.ready .more{grid-template-rows:1fr}
.more>div{overflow:hidden;min-height:0;padding:0 2px}

.tagline{
  margin:26px auto 30px;max-width:30ch;text-align:center;
  font-size:15px;line-height:1.6;color:var(--muted);
}
.links{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.links li{
  opacity:0;transform:translateY(10px);
  transition:opacity .6s var(--ease),transform .6s var(--ease);
  transition-delay:calc(.35s + var(--i)*.09s);
}
.ready .links li{opacity:1;transform:none}
.ready .tagline{opacity:1}
.tagline{opacity:0;transition:opacity .8s ease .3s}

.link{
  display:flex;align-items:center;gap:14px;
  padding:15px 16px;border-radius:14px;
  border:1px solid var(--line);
  color:var(--ink);text-decoration:none;
  background:rgba(255,255,255,.03);
  transition:border-color .2s,background .2s,transform .2s;
}
.link:hover{border-color:var(--blue-hi);background:rgba(3,88,255,.1)}
.link:active{transform:scale(.985)}
.link:focus-visible{outline:2px solid var(--blue-hi);outline-offset:3px}
.link.destaque{background:var(--blue);border-color:var(--blue)}
.link.destaque:hover{background:var(--blue-hi);border-color:var(--blue-hi)}
.ico{
  flex:none;width:42px;height:42px;border-radius:11px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.07);
}
.destaque .ico{background:rgba(255,255,255,.18)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.txt span{display:block;margin-top:2px;font-size:12.5px;color:var(--muted);line-height:1.4}
.destaque .txt span{color:rgba(255,255,255,.82)}
.chev{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.6}

.foot{margin-top:30px;text-align:center;font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  .logo{animation:none;clip-path:none}
  .more,.links li,.tagline,.angle{transition:none}
}

/* ---------- Painel de edição (#admin) ---------- */
#admin{display:none;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) 18px 60px}
body.admin-open #admin{display:block}
body.admin-open .page,body.admin-open .angle{display:none}
.adm{max-width:520px;margin:0 auto}
.adm h1{font-size:20px;font-weight:700;margin:6px 0 4px}
.adm p.ajuda{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 18px}
.adm label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.adm input,.adm select{display:block;width:100%;margin-top:5px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0b0b0b;color:var(--ink);font:inherit;font-size:14.5px}
.adm input:focus,.adm select:focus{outline:2px solid var(--blue-hi);outline-offset:1px}
.adm .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adm .item{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px;background:rgba(255,255,255,.03)}
.adm .item[data-tipo=whatsapp] .w-url,.adm .item[data-tipo=link] .w-msg{display:none}
.adm .chk{display:flex;align-items:center;gap:8px;color:var(--ink)}
.adm .chk input{width:auto;margin:0}
.adm .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.adm button{font:inherit;font-size:13.5px;font-weight:600;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.adm button:hover{border-color:var(--blue-hi)}
.adm button.prim{background:var(--blue);border-color:var(--blue)}
.adm button.prim:hover{background:var(--blue-hi)}
.adm button.perigo{color:#ff8a8a}
.adm .barra{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.adm .msg{font-size:13.5px;min-height:20px;margin-top:6px}
.adm .msg.ok{color:#6ee7a0}.adm .msg.erro{color:#ff8a8a}
.adm a.voltar{color:var(--muted);font-size:13px}
.adm ol{padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--muted)}
</style>
</head>

<section id="admin"><div class="adm" id="admBox"></div></section>

<script>
/* ============================================================
   CONFIGURAÇÃO DO PORTAL
   Pelo painel (seusite/#admin) você muda tudo sem mexer neste arquivo.
   Os valores abaixo valem enquanto o painel não estiver ligado
   (e também se o banco de dados estiver fora do ar).

   TELEFONE: só números, com 55 + DDD. Ex.: "5527999999999"
   Botões do tipo "whatsapp" usam esse telefone automaticamente.
   Se o telefone estiver vazio, esses botões não aparecem.

   FIREBASE_CONFIG: cole aqui as chaves do seu projeto Firebase
   (Configurações do projeto > Seus apps > Web). Deixe null para
   usar só o que está neste arquivo.

   Regras do Firestore (aba Regras):
   rules_version = '2';
   service cloud.firestore { match /databases/{db}/documents {
     match /portal/{doc} {
       allow read: if true;
       allow write: if request.auth != null
         && request.auth.token.email == "evastek@gmail.com";
     } } }
   ============================================================ */
const TELEFONE = "";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzKOUEHcMWsLdgdqbT9MuyQcNUoNKtITM",
  authDomain: "evastekportal.firebaseapp.com",
  projectId: "evastekportal",
  storageBucket: "evastekportal.firebasestorage.app",
  messagingSenderId: "197791614216",
  appId: "1:197791614216:web:f933de4ed2cdceab5d98bd"
};

const LINKS = [
  { titulo:"Falar no WhatsApp",    sub:"Conversa direta com a Evastek", tipo:"whatsapp", mensagem:"Olá! Vim pelo portal da Evastek.", icone:"whatsapp", destaque:true },
  { titulo:"Instagram",            sub:"@evastek", tipo:"link", url:"https://instagram.com/evastek", icone:"instagram" },
  { titulo:"Agendar uma conversa", sub:"Entenda como podemos ajudar seu negócio", tipo:"whatsapp", mensagem:"Olá! Quero agendar uma conversa.", icone:"calendario" },
];

const ICONES = {
  whatsapp:`<path d="M12 3.5a8.5 8.5 0 0 0-7.3 12.8L3.5 20.5l4.4-1.2A8.5 8.5 0 1 0 12 3.5z"/><path d="M9.4 8.2c-.3.3-.5.8-.3 1.4.7 2 2.3 3.6 4.3 4.3.6.2 1.1 0 1.4-.3l.4-.5a.5.5 0 0 0-.1-.7l-1.2-.7a.5.5 0 0 0-.7.1l-.3.4c-.9-.4-1.6-1.1-2-2l.4-.3a.5.5 0 0 0 .1-.7l-.7-1.2a.5.5 0 0 0-.7-.1z"/>`,
  instagram:`<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6"/>`,
  calendario:`<rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>`,
  site:`<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 3.6 5.2 3.6 8.5s-1.1 6.1-3.6 8.5c-2.5-2.4-3.6-5.2-3.6-8.5s1.1-6.1 3.6-8.5z"/>`,
  arquivo:`<path d="M7 3.5h6.5L18 8v12.5H7z"/><path d="M13.5 3.5V8H18M9.5 13h5M9.5 16.5h5"/>`,
  email:`<rect x="3.5" y="5.5" width="17" height="13" rx="3"/><path d="M4.5 7.5l7.5 5.5 7.5-5.5"/>`
};
const NOMES_ICONE = {whatsapp:"WhatsApp",instagram:"Instagram",calendario:"Calendário",site:"Site",arquivo:"Documento",email:"E-mail"};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const soNum = s => String(s || "").replace(/\D/g, "");
const ul = document.getElementById("links");
let cfg = { telefone: TELEFONE, links: LINKS };

function urlDe(l, tel){
  if (l.tipo === "whatsapp"){
    const n = soNum(tel); if (!n) return null;
    return "https://wa.me/" + n + (l.mensagem ? "?text=" + encodeURIComponent(l.mensagem) : "");
  }
  const u = String(l.url || "").trim();
  return /^(https?:|mailto:|tel:)/i.test(u) ? u : null;
}

function render(){
  ul.innerHTML = "";
  let i = 0;
  cfg.links.forEach(l => {
    const u = urlDe(l, cfg.telefone); if (!u) return;
    const li = document.createElement("li");
    li.style.setProperty("--i", i++);
    li.innerHTML =
      `<a class="link${l.destaque ? " destaque" : ""}" href="${esc(u)}" target="_blank" rel="noopener">
         <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[l.icone] || ICONES.site}</svg></span>
         <span class="txt"><b>${esc(l.titulo)}</b>${l.sub ? `<span>${esc(l.sub)}</span>` : ""}</span>
         <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
       </a>`;
    ul.appendChild(li);
  });
}

/* ---------- Firebase (só se FIREBASE_CONFIG estiver preenchido) ---------- */
let db = null, auth = null;
const loadScript = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
async function initFirebase(){
  if (!FIREBASE_CONFIG) return false;
  try {
    const b = "https://www.gstatic.com/firebasejs/10.12.2/";
    await loadScript(b + "firebase-app-compat.js");
    await Promise.all([loadScript(b + "firebase-firestore-compat.js"), loadScript(b + "firebase-auth-compat.js")]);
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore(); auth = firebase.auth();
    return true;
  } catch(e){ return false; }
}
async function carregar(){
  if (!(await initFirebase())) return;
  try {
    const d = await db.collection("portal").doc("config").get();
    if (d.exists){ const x = d.data(); cfg = { telefone: x.telefone ?? TELEFONE, links: Array.isArray(x.links) ? x.links : LINKS }; }
  } catch(e){}
}

/* ---------- Painel #admin ---------- */
const box = document.getElementById("admBox");
const OPCOES_ICONE = Object.keys(NOMES_ICONE).map(k => `<option value="${k}">${NOMES_ICONE[k]}</option>`).join("");

function itemHTML(l){
  return `<div class="item" data-tipo="${l.tipo === "link" ? "link" : "whatsapp"}">
    <div class="row">
      <label>Título<input class="f-titulo" value="${esc(l.titulo)}"></label>
      <label>Subtítulo<input class="f-sub" value="${esc(l.sub)}"></label>
    </div>
    <div class="row">
      <label>Tipo<select class="f-tipo"><option value="whatsapp"${l.tipo !== "link" ? " selected" : ""}>WhatsApp</option><option value="link"${l.tipo === "link" ? " selected" : ""}>Link comum</option></select></label>
      <label>Ícone<select class="f-icone">${OPCOES_ICONE.replace(`value="${l.icone}"`, `value="${l.icone}" selected`)}</select></label>
    </div>
    <label class="w-msg">Mensagem que já vem escrita no WhatsApp<input class="f-msg" value="${esc(l.mensagem)}"></label>
    <label class="w-url">Link (começa com https://)<input class="f-url" value="${esc(l.url)}" placeholder="https://"></label>
    <label class="chk"><input type="checkbox" class="f-dest"${l.destaque ? " checked" : ""}> Botão em destaque (azul)</label>
    <div class="acoes">
      <button type="button" data-a="up">Subir</button>
      <button type="button" data-a="down">Descer</button>
      <button type="button" class="perigo" data-a="del">Remover</button>
    </div>
  </div>`;
}
function coletar(){
  cfg.telefone = soNum(document.getElementById("f-tel").value);
  cfg.links = [...box.querySelectorAll(".item")].map(el => ({
    titulo: el.querySelector(".f-titulo").value.trim(),
    sub: el.querySelector(".f-sub").value.trim(),
    tipo: el.querySelector(".f-tipo").value,
    icone: el.querySelector(".f-icone").value,
    mensagem: el.querySelector(".f-msg").value.trim(),
    url: el.querySelector(".f-url").value.trim(),
    destaque: el.querySelector(".f-dest").checked
  }));
}
function mostrarEditor(){
  box.innerHTML = `<a class="voltar" href="#">Voltar ao portal</a>
    <h1>Editar portal</h1>
    <p class="ajuda">Mude o telefone, os textos e os botões. Ao salvar, o portal já fica atualizado para todo mundo.</p>
    <label>Telefone do WhatsApp (com 55 e DDD)<input id="f-tel" inputmode="numeric" value="${esc(cfg.telefone)}" placeholder="5527999999999"></label>
    <div id="lista">${cfg.links.map(itemHTML).join("")}</div>
    <div class="barra">
      <button type="button" id="b-add">Adicionar botão</button>
      <button type="button" class="prim" id="b-salvar">Salvar</button>
      <button type="button" id="b-sair">Sair</button>
    </div>
    <div class="msg" id="msg" role="status"></div>`;
}
function msg(t, ok){ const m = document.getElementById("msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "erro"); }
box.addEventListener("change", e => { if (e.target.classList.contains("f-tipo")) e.target.closest(".item").dataset.tipo = e.target.value; });
box.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "b-add"){ coletar(); cfg.links.push({ titulo:"Novo botão", sub:"", tipo:"link", url:"", icone:"site" }); mostrarEditor(); return; }
  if (b.id === "b-sair"){ await auth.signOut(); return; }
  if (b.id === "b-salvar"){
    coletar();
    try { await db.collection("portal").doc("config").set({ telefone: cfg.telefone, links: cfg.links }); msg("Salvo. O portal já está atualizado.", true); }
    catch(err){ msg("Não consegui salvar. Confira o login e as regras do Firestore.", false); }
    return;
  }
  const it = b.closest(".item"); if (!it) return;
  coletar();
  const i = [...box.querySelectorAll(".item")].indexOf(it), a = b.dataset.a, L = cfg.links;
  if (a === "del") L.splice(i, 1);
  if (a === "up" && i > 0) [L[i-1], L[i]] = [L[i], L[i-1]];
  if (a === "down" && i < L.length - 1) [L[i+1], L[i]] = [L[i], L[i+1]];
  mostrarEditor();
});
function mostrarLogin(){
  box.innerHTML = `<a class="voltar" href="#">Voltar ao portal</a>
    <h1>Entrar</h1>
    <p class="ajuda">Acesso só da equipe Evastek.</p>
    <label>E-mail<input id="l-email" type="email" autocomplete="username"></label>
    <label>Senha<input id="l-senha" type="password" autocomplete="current-password"></label>
    <div class="barra"><button type="button" class="prim" id="l-ok">Entrar</button></div>
    <div class="msg" id="msg" role="status"></div>`;
  document.getElementById("l-ok").onclick = async () => {
    try { await auth.signInWithEmailAndPassword(document.getElementById("l-email").value.trim(), document.getElementById("l-senha").value); }
    catch(err){ msg("E-mail ou senha incorretos.", false); }
  };
}
function mostrarConfigurar(){
  box.innerHTML = `<a class="voltar" href="#">Voltar ao portal</a>
    <h1>Falta ligar o banco de dados</h1>
    <p class="ajuda">Para editar o portal por aqui, siga os passos e depois cole as chaves em <b>FIREBASE_CONFIG</b>, no começo do script do index.html:</p>
    <ol>
      <li>Crie um projeto no Firebase e ative o Firestore Database.</li>
      <li>Em Authentication, ative E-mail/senha e crie o usuário da equipe.</li>
      <li>Cole as regras que estão no comentário do index.html.</li>
      <li>Em Configurações do projeto, copie as chaves do app Web.</li>
    </ol>`;
}
async function abrirAdmin(){
  document.body.classList.add("admin-open");
  await dados;
  if (!FIREBASE_CONFIG || !auth){ mostrarConfigurar(); return; }
  auth.onAuthStateChanged(u => u ? mostrarEditor() : mostrarLogin());
}
function rota(){
  if (location.hash === "#admin") abrirAdmin();
  else document.body.classList.remove("admin-open");
}

/* ---------- Início: intro + dados ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const intro = new Promise(r => setTimeout(r, reduce ? 0 : 1500));
const dados = Promise.race([carregar(), new Promise(r => setTimeout(r, 3500))]);
Promise.all([intro, dados]).then(() => {
  render();
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("ready")));
});
addEventListener("hashchange", rota);
rota();
</script>
